openapi: 3.1.0
info:
  title: Atlas organization staging pilot
  version: 0.1.0
  description: Staging-only feature. No paid team entitlements or email delivery. All writes require the exact configured Origin. All responses disable caching; API handlers return X-Request-ID. Auth middleware can deny a request before the handler.
security:
  - customerSession: []
paths:
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      responses:
        '200':
          description: Own organizations, newest first, maximum 50.
        default: {$ref: '#/components/responses/Failure'}
    post:
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, name]
              properties:
                requestId: {type: string, format: uuid}
                name: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: Created or replayed organization. Same requestId with a different owner or name is rejected. Five pilot seats; maximum ten creations per owner.
        default: {$ref: '#/components/responses/Failure'}
  /api/v1/organizations/{id}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      operationId: organizationDetail
      responses:
        '200':
          description: Organization, caller role and member IDs/roles; active membership required.
        default: {$ref: '#/components/responses/Failure'}
  /api/v1/organizations/{id}/members:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    patch:
      operationId: changeMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, role]
              properties:
                userId: {$ref: '#/components/schemas/UserId'}
                role: {$ref: '#/components/schemas/AssignableRole'}
      responses:
        '200': {description: Updated. Only owner may change a non-owner role.}
        default: {$ref: '#/components/responses/Failure'}
    delete:
      operationId: removeMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: {$ref: '#/components/schemas/UserId'}
      responses:
        '200': {description: Removed. Only owner may remove a non-owner member.}
        default: {$ref: '#/components/responses/Failure'}
  /api/v1/organizations/{id}/invitations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      operationId: listInvitations
      responses:
        '200': {description: Latest 100 invitation metadata records for owner/admin. No tokens or hashes.}
        default: {$ref: '#/components/responses/Failure'}
    post:
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email, maxLength: 254}
                role: {$ref: '#/components/schemas/AssignableRole'}
      responses:
        '200':
          description: One-time token, invitation ID and expiry. Owner may invite any assignable role; admin may invite member/viewer. Pending invitations reserve seats. Reissuing invalidates the old token. No email is sent.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expiresAt]
                properties:
                  id: {type: string, format: uuid}
                  token: {type: string, pattern: '^[a-f0-9]{64}$'}
                  expiresAt: {type: integer, description: Unix milliseconds}
        default: {$ref: '#/components/responses/Failure'}
    delete:
      operationId: revokeInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitationId]
              properties:
                invitationId: {type: string, format: uuid}
      responses:
        '200': {description: Revoked. Admin cannot revoke invitations granting admin or billing_admin.}
        default: {$ref: '#/components/responses/Failure'}
  /api/v1/organizations/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Joined organization ID; verified recipient, unexpired single-use token and capacity required.}
        default: {$ref: '#/components/responses/Failure'}
  /api/v1/organizations/{id}/audit:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      operationId: listOrganizationAudit
      responses:
        '200': {description: Latest 100 organization events for owner/admin; no full audit pagination yet.}
        default: {$ref: '#/components/responses/Failure'}
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-atlas-session
  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    UserId: {type: string, pattern: '^[a-f0-9]{64}$'}
    AssignableRole:
      type: string
      enum: [admin, billing_admin, member, viewer]
  responses:
    Failure:
      description: 400 invalid input; 401 sign-in required; 403 origin denied; 404 inaccessible resource; 409 seat/operation conflict; 503 disabled or unavailable.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}