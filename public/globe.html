<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraTrade globe</title><link rel="stylesheet" href="/cesium/Widgets/widgets.css"><style>html,body,#earth{height:100%;width:100%;margin:0;overflow:hidden;background:#071117}.cesium-viewer-bottom{bottom:145px!important;left:12px!important;max-width:calc(100% - 24px)}.cesium-widget-credits{font-size:9px!important;opacity:.7}#error{position:absolute;top:50%;width:80%;left:10%;text-align:center;color:#d7e4e8;font:14px Arial;z-index:5}#terrain{position:absolute;bottom:153px;right:14px;font:9px Arial;color:#91a4ac;pointer-events:none}</style></head><body><div id="earth"></div><div id="error"></div><div id="terrain"></div><script>window.CESIUM_BASE_URL="/cesium/";</script><script src="/cesium/Cesium.js" onerror="parent.postMessage({type:'error',message:'Globe library could not load. Check your connection.'},location.origin)"></script><script>
const tell=d=>parent.postMessage(d,location.origin);let viewer,countrySource,countries=[],routeEntities=[],countryLabels=[],portEntities=[],waterEntities=[],tradeEntity=null,alphaLayer=null,state={};
const colors={goods:'#61d9c7',oil:'#eeac68',bulk:'#a1bce6',metals:'#e5cc79',rail:'#b99cec',air:'#ee9cae'};
const flag=code=>/^[A-Z]{2}$/.test(code)?String.fromCodePoint(...code.split('').map(c=>c.charCodeAt(0)+127397)):'🌐';
const codeOf=p=>{let c=p.ISO_A2||p.ISO_A2_EH;return /^[A-Z]{2}$/.test(c)?c:({FRA:'FR',NOR:'NO',XKX:'XK',CYN:'CY',SOL:'SO',TWN:'TW'}[p.ADM0_A3]||'');};
function countryName(p){try{const code=codeOf(p);if(code)return new Intl.DisplayNames([state.language||'en'],{type:'region'}).of(code)||p.ADMIN;}catch{}return p.ADMIN||p.NAME;}
const pos=(lon,lat,height=0)=>Cesium.Cartesian3.fromDegrees(lon,lat,height);
function reset(){viewer.camera.flyTo({destination:pos(55,20,viewer.scene.canvas.clientWidth<500?20000000:15500000),duration:1.2});}
async function start(){try{
 if(!window.Cesium)throw Error('Globe library unavailable');Cesium.Ion.defaultAccessToken='';
 viewer=new Cesium.Viewer('earth',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,requestRenderMode:true,maximumRenderTimeChange:Infinity});
 viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#071117');viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#102c3b');viewer.scene.globe.enableLighting=false;viewer.scene.skyBox.show=false;viewer.scene.sun.show=false;viewer.scene.moon.show=false;viewer.scene.screenSpaceCameraController.minimumZoomDistance=2000;viewer.scene.screenSpaceCameraController.maximumZoomDistance=45000000;viewer.camera.setView({destination:pos(55,20,viewer.scene.canvas.clientWidth<500?20000000:15500000)});
 const imagery=await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer');viewer.imageryLayers.addImageryProvider(imagery);tell({type:'ready'});
 Cesium.ArcGISTiledElevationTerrainProvider.fromUrl('https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer').then(t=>{viewer.terrainProvider=t;document.getElementById('terrain').textContent='ESRI ELEVATION TERRAIN';viewer.scene.requestRender();}).catch(()=>{document.getElementById('terrain').textContent='SATELLITE RELIEF · ELEVATION UNAVAILABLE';});
 const geo=await fetch('/countries.geojson').then(r=>{if(!r.ok)throw Error('Country data unavailable');return r.json();});countries=geo.features;
 countrySource=new Cesium.CustomDataSource('Natural Earth borders');for(const f of countries){const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;for(const poly of polys){const e=countrySource.entities.add({polyline:{positions:poly[0].map(([lon,lat])=>pos(lon,lat)),width:1,clampToGround:true,material:Cesium.Color.fromCssColorString('#c1d4dc').withAlpha(.32)}});e.country=f.properties;}}viewer.dataSources.add(countrySource);
 renderCountries();apply(state);
 const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);handler.setInputAction(e=>{const picked=viewer.scene.pick(e.position);if(picked&&picked.id){const entity=picked.id;if(entity.routeId){tell({type:'route',id:entity.routeId});return;}const p=entity.country||entity.properties?.getValue(Cesium.JulianDate.now());if(p&&p.ADMIN){tell({type:'country',country:{name:countryName(p),flag:flag(codeOf(p)),code:codeOf(p),continent:p.CONTINENT,region:p.SUBREGION||p.REGION_UN}});return;}}const ray=viewer.camera.getPickRay(e.position),cart=viewer.scene.globe.pick(ray,viewer.scene);if(cart){const c=Cesium.Cartographic.fromCartesian(cart),lon=Cesium.Math.toDegrees(c.longitude),lat=Cesium.Math.toDegrees(c.latitude);const f=countries.find(f=>contains(f.geometry,lon,lat));if(f){const p=f.properties;tell({type:'country',country:{name:countryName(p),flag:flag(codeOf(p)),code:codeOf(p),continent:p.CONTINENT,region:p.SUBREGION||p.REGION_UN}});}}},Cesium.ScreenSpaceEventType.LEFT_CLICK);
 }catch(e){document.getElementById('error').textContent='Unable to load globe: '+e.message;tell({type:'error',message:'The satellite globe is unavailable. Check your connection and retry.'});}}
function inside(ring,x,y){let yes=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))yes=!yes;}return yes;}
function contains(g,x,y){const polygons=g.type==='Polygon'?[g.coordinates]:g.coordinates;return polygons.some(p=>inside(p[0],x,y)&&!p.slice(1).some(h=>inside(h,x,y)));}
function renderCountries(){for(const e of countryLabels)viewer.entities.remove(e);countryLabels=[];for(const f of countries){const p=f.properties;let lon=p.LABEL_X,lat=p.LABEL_Y;if(!Number.isFinite(lon)||!Number.isFinite(lat)){const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;const ring=polys.reduce((a,b)=>a[0].length>b[0].length?a:b)[0];lon=ring.reduce((s,a)=>s+a[0],0)/ring.length;lat=ring.reduce((s,a)=>s+a[1],0)/ring.length;}const code=codeOf(p),name=countryName(p);const entity=viewer.entities.add({position:pos(lon,lat,10000),label:{text:name,font:'10px sans-serif',fillColor:Cesium.Color.fromCssColorString('#e4edf0'),outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,0),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,Number(p.POP_EST)>75000000?42000000:Number(p.POP_EST)>20000000?16000000:9000000)},...(code?{billboard:{image:'https://flagcdn.com/w40/'+code.toLowerCase()+'.png',width:18,height:12,pixelOffset:new Cesium.Cartesian2(0,-19),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,Number(p.POP_EST)>75000000?42000000:9000000)}}:{})});entity.country=p;entity.show=state.labels!==false;countryLabels.push(entity);}}
function apply(d){if(!viewer)return;const previousAlpha=state.alphaEarth,previousLanguage=state.language;state={...state,...d};if(d.action==='zoomIn')viewer.camera.zoomIn(viewer.camera.positionCartographic.height*.3);if(d.action==='zoomOut')viewer.camera.zoomOut(viewer.camera.positionCartographic.height*.3);if(d.action==='reset')reset();if(d.focus){const e=routeEntities.find(e=>e.routeId===d.focus);if(e)viewer.flyTo(e,{duration:1.5,offset:new Cesium.HeadingPitchRange(0,-Math.PI/2,7000000)});}if(d.routes){for(const e of routeEntities)viewer.entities.remove(e);routeEntities=[];for(const r of d.routes){const aerial=r.category==='air'||r.category==='metals',positions=[];if(aerial){const a=Cesium.Cartographic.fromDegrees(...r.path[0]),b=Cesium.Cartographic.fromDegrees(...r.path[r.path.length-1]),line=new Cesium.EllipsoidGeodesic(a,b);for(let i=0;i<=60;i++){const f=i/60,c=line.interpolateUsingFraction(f);positions.push(Cesium.Cartesian3.fromRadians(c.longitude,c.latitude,Math.sin(Math.PI*f)*900000+20000));}}else for(const [lon,lat]of r.path)positions.push(pos(lon,lat,18000));const e=viewer.entities.add({polyline:{positions,width:aerial?1.5:2,arcType:Cesium.ArcType.GEODESIC,material:aerial||r.category==='rail'?new Cesium.PolylineDashMaterialProperty({color:Cesium.Color.fromCssColorString(colors[r.category]),dashLength:12}):new Cesium.PolylineGlowMaterialProperty({color:Cesium.Color.fromCssColorString(colors[r.category]),glowPower:.14})}});e.routeId=r.id;routeEntities.push(e);}}
 if('tradePair' in d){if(tradeEntity)viewer.entities.remove(tradeEntity);tradeEntity=null;const pair=d.tradePair;if(pair?.available&&pair?.reporter&&pair?.partner){const find=c=>countries.find(f=>codeOf(f.properties)===c.iso2)?.properties;const a=find(pair.reporter),b=find(pair.partner);if(a&&b){tradeEntity=viewer.entities.add({polyline:{positions:[pos(a.LABEL_X,a.LABEL_Y,120000),pos(b.LABEL_X,b.LABEL_Y,120000)],width:3,material:new Cesium.PolylineDashMaterialProperty({color:Cesium.Color.fromCssColorString('#ffffff').withAlpha(.8),dashLength:18}),arcType:Cesium.ArcType.GEODESIC}});}}}
 if('alphaEarth' in d&&d.alphaEarth?.image!==previousAlpha?.image){if(alphaLayer){viewer.imageryLayers.remove(alphaLayer);alphaLayer=null;}if(d.alphaEarth){const a=d.alphaEarth;Cesium.SingleTileImageryProvider.fromUrl(a.image,{rectangle:Cesium.Rectangle.fromDegrees(...a.bounds),credit:'The AlphaEarth Foundations Satellite Embedding dataset is produced by Google and Google DeepMind. CC-BY 4.0.'}).then(provider=>{if(state.alphaEarth?.image!==a.image)return;alphaLayer=viewer.imageryLayers.addImageryProvider(provider);alphaLayer.alpha=.8;viewer.camera.flyTo({destination:pos(a.lon,a.lat,210000),duration:1.6});viewer.scene.requestRender();}).catch(e=>tell({type:'error',message:'AlphaEarth preview could not load.'}));}}
 if(d.ports&&!portEntities.length){for(const p of d.ports)portEntities.push(viewer.entities.add({position:pos(p.lon,p.lat,22000),point:{pixelSize:5,color:Cesium.Color.fromCssColorString('#a7e7df'),outlineWidth:1,outlineColor:Cesium.Color.BLACK},label:{text:p.name,font:'10px sans-serif',fillColor:Cesium.Color.fromCssColorString('#91b4ba'),outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(10,-8),horizontalOrigin:Cesium.HorizontalOrigin.LEFT,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,14000000)}}));}
 if(d.language&&d.language!==previousLanguage&&countries.length)renderCountries();for(const e of countryLabels)e.show=state.labels!==false;if(countrySource)countrySource.show=state.borders!==false;
 if(d.stations){for(const e of waterEntities)viewer.entities.remove(e);waterEntities=[];for(const s of d.stations)waterEntities.push(viewer.entities.add({position:pos(s.lon,s.lat,25000),point:{pixelSize:s.id===state.station?12:8,color:Cesium.Color.fromCssColorString('#62cfff'),outlineWidth:2,outlineColor:Cesium.Color.WHITE},label:{text:s.name,font:'10px sans-serif',fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(10,15),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,12000000)},show:!!state.waterLayer}));}for(const e of waterEntities)e.show=!!state.waterLayer;viewer.scene.requestRender();}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||!e.data||typeof e.data!=='object'||Array.isArray(e.data)||e.data.type!=='atlas')return;apply(e.data);});start();
</script></body></html>
